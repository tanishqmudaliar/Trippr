name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract release notes and auto-generate title
        id: release_meta
        run: node scripts/extract-release.js "${{ github.ref_name }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.release_meta.outputs.title }}
        run: |
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            || gh release edit "$TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md
