name: Bug Report
description: Create a report to help us improve Trippr
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before submitting, please ensure this is a reproducible bug and not a question.
  - type: input
    id: version
    attributes:
      label: Trippr Version
      description: What version or deployment of Trippr are you using?
      placeholder: "e.g. v1.5.2 or https://tripprbytanishq.vercel.app"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '/entries'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Browser / Device
      options:
        - Chrome / Chromium
        - Firefox
        - Safari (iOS / macOS)
        - Edge
        - Other
    validations:
      required: true
